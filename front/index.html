<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente de Refatoração LLM</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        textarea { width: 100%; height: 300px; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical; font-family: monospace; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 20px; width: 30%; }
        button { background-color: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; transition: background-color 0.3s; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Assistente de Refatoração LLM</h1>
        <p>Cole o seu código "sujo" abaixo, escolha a linguagem, e deixe a IA cuidar da refatoração e da complexidade!</p>
        
        <form action="/refatorar" method="POST">
            
            <label for="linguagem">Linguagem do Código:</label>
            <select name="linguagem" id="linguagem" required>
                <option value="Python">Python</option>
                <option value="Java">Java</option>
                <option value="JavaScript">JavaScript</option>
                <option value="C#">C#</option>
                <option value="Any">Outra/Genérica</option>
            </select>
            
            <label for="codigo_original">Código Original:</label>
            <textarea name="codigo_original" id="codigo_original" placeholder="Insira seu código aqui..." required></textarea>
            
            <button type="submit">Analisar e Refatorar</button>
        </form>
    </div>
</body>
</html>
